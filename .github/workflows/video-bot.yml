name: Video Auto Bot V2

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

jobs:
  generate-video:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AUTO_PUBLISH: "false"
          NICHE: "GTA 6"
          LANGUAGE: "français"
          IMAGE_COUNT: "8"
        run: python main.py

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: generated-video-v2
          path: output/
          retention-days: 7
